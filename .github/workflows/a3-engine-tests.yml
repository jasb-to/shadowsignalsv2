name: A3 Engine Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm test
        run: pnpm test

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Production build
        run: pnpm build

      - name: Production E2E
        run: |
          set -euo pipefail
          url="https://a3markets.vercel.app/api/intelligence?symbol=BTC"
          for attempt in $(seq 1 30); do
            if body=$(curl -fsS --max-time 20 "$url"); then
              node -e 'const x=JSON.parse(process.argv[1]); if(x.symbol!=="BTC" || !Number.isFinite(x.price) || !Number.isFinite(x.score) || !Number.isFinite(x.confidence) || !x.signal) process.exit(1)' "$body" && exit 0
            fi
            echo "Production E2E attempt $attempt failed; waiting for deployment/API readiness..."
            sleep 10
          done
          echo "Production E2E failed after 30 attempts"
          exit 1
