name: A3 Engine Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm test
        run: pnpm test

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Production build
        run: pnpm build

      - name: Production trust checks
        if: github.event_name != 'pull_request'
        env:
          A3_PRODUCTION_BASE_URL: ${{ vars.A3_PRODUCTION_BASE_URL }}
          A3_TEST_API_KEY: ${{ secrets.A3_TEST_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${A3_PRODUCTION_BASE_URL:-}" ]; then
            echo "::notice:: A3_PRODUCTION_BASE_URL is not configured; production checks are skipped."
            exit 0
          fi

          if [[ "$A3_PRODUCTION_BASE_URL" != https://* ]]; then
            echo "::error:: A3_PRODUCTION_BASE_URL must be an HTTPS origin."
            exit 1
          fi

          base="${A3_PRODUCTION_BASE_URL%/}"

          # Wait for the deployment, then check the public dashboard API.
          for attempt in $(seq 1 30); do
            if body=$(curl -fsS --max-time 20 "$base/api/intelligence?symbol=BTC"); then
              node -e 'const x=JSON.parse(process.argv[1]); if(x.symbol!=="BTC" || !Number.isFinite(x.price) || !Number.isFinite(x.score) || !Number.isFinite(x.confidence) || !x.signal) process.exit(1)' "$body"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Production intelligence endpoint did not become ready"
              exit 1
            fi
            echo "Production API attempt $attempt failed; retrying..."
            sleep 10
          done

          # ATH is always a CoinGecko current ATH or null. Drawdown must
          # be null when either input is unavailable, otherwise it must
          # match the direct price/ATH calculation.
          cycle=$(curl -fsS --max-time 30 "$base/api/market-cycle")
          node - "$cycle" <<'NODE'
          const x = JSON.parse(process.argv[2]);
          const b = x.bullMarket;
          if (!b || !Object.prototype.hasOwnProperty.call(b, "ath") ||
              !Object.prototype.hasOwnProperty.call(b, "drawdownPct")) {
            throw new Error("ATH fields are missing");
          }
          const ath = b.ath;
          const price = b.currentPrice;
          const drawdown = b.drawdownPct;
          if (ath !== null && (!Number.isFinite(ath) || ath <= 0)) {
            throw new Error("Current ATH must be a positive finite value or null");
          }
          if (drawdown !== null && !Number.isFinite(drawdown)) {
            throw new Error("Drawdown must be finite or null");
          }
          if (ath === null || !Number.isFinite(price) || price <= 0) {
            if (drawdown !== null) throw new Error("Drawdown must be null when ATH/price is unavailable");
          } else {
            const expected = ((price / ath) - 1) * 100;
            if (drawdown === null || Math.abs(drawdown - expected) > 0.01) {
              throw new Error("Drawdown does not match current price/current ATH");
            }
          }
          console.log("ATH/drawdown consistency passed");
          NODE

          # Each timeframe must contain an independent completed candle series.
          mtf=$(curl -fsS --max-time 60 "$base/api/comprehensive-analysis?symbol=BTC")
          node - "$mtf" <<'NODE'
          const x = JSON.parse(process.argv[2]);
          const oneH = x.multiTimeframe?.["1h"];
          const oneD = x.multiTimeframe?.["1d"];
          for (const [name, tf] of [["1h", oneH], ["1d", oneD]]) {
            if (!tf?.available || !Number.isFinite(tf.price) || tf.price <= 0 ||
                !Number.isFinite(tf.lastCandleTimestamp)) {
              throw new Error(name + " timeframe is unavailable or missing a completed candle timestamp");
            }
            if (!(tf.rsi === null || (Number.isFinite(tf.rsi) && tf.rsi >= 0 && tf.rsi <= 100))) {
              throw new Error(name + " RSI is invalid");
            }
          }
          if (oneH.lastCandleTimestamp === oneD.lastCandleTimestamp) {
            throw new Error("1h and 1d observations use the same candle timestamp");
          }
          if (oneH.price === oneD.price && oneH.rsi === oneD.rsi) {
            throw new Error("1h and 1d price/RSI are unexpectedly identical");
          }
          console.log("Independent timeframe checks passed");
          NODE

          # The paid API must reject an unauthenticated request.
          unauth_status=$(curl -sS -o /tmp/a3-unauth.json -w '%{http_code}' --max-time 30 "$base/api/v1/intelligence?symbol=BTC")
          if [ "$unauth_status" != "401" ]; then
            echo "Expected unauthenticated metered API to return 401; got $unauth_status"
            cat /tmp/a3-unauth.json
            exit 1
          fi

          # Optional Pro key is supplied as a GitHub Actions secret. This
          # tests a live authenticated success without committing any key.
          if [ -n "${A3_TEST_API_KEY:-}" ]; then
            auth_status=$(curl -sS -o /tmp/a3-auth.json -w '%{http_code}' --max-time 60 \
              -H "Authorization: Bearer $A3_TEST_API_KEY" \
              "$base/api/v1/intelligence?symbol=BTC")
            if [ "$auth_status" != "200" ]; then
              echo "Expected authenticated metered API to return 200; got $auth_status"
              cat /tmp/a3-auth.json
              exit 1
            fi
            echo "Authenticated metered API check passed"
          else
            echo "A3_TEST_API_KEY secret is not configured; authenticated test skipped"
          fi
